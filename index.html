<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
 
<style>
    * {
        box-sizing: border-box;
    }
 
    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: transparent;
        font-family: Arial, sans-serif;
    }
 
    #sparks {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px;
        padding: 10px;
    }
 
    .spark {
        min-height: 48px;
        padding: 9px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border: 1px solid #cfcfcf;
        border-radius: 8px;
        background: white;
        font-size: 14px;
        line-height: 1.3;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
 
    .spark-name {
        min-width: 0;
        overflow-wrap: break-word;
        white-space: normal;
    }
 
    .stars {
        flex-shrink: 0;
        white-space: nowrap;
        letter-spacing: 1px;
    }
 
    #message {
        display: none;
        padding: 12px;
        text-align: center;
        color: #888;
        font-size: 14px;
    }
</style>
</head>
 
<body>
 
<div id="sparks"></div>
<div id="message"></div>
 
<script>
 
grist.ready({
    requiredAccess: "full"
});
 
const sparksContainer = document.getElementById("sparks");
const message = document.getElementById("message");
 
let currentRunId = null;
let updateToken = 0;
 
function clearWidget() {
    sparksContainer.innerHTML = "";
    message.style.display = "none";
}
 
function showMessage(text) {
    sparksContainer.innerHTML = "";
    message.textContent = text;
    message.style.display = "block";
}
 
function createSpark(name, starsAmount) {
    const box = document.createElement("div");
    box.className = "spark";
 
    const nameElement = document.createElement("span");
    nameElement.className = "spark-name";
    nameElement.textContent = name ?? "";
 
    const starsElement = document.createElement("span");
    starsElement.className = "stars";
    const amount = Number(starsAmount) || 0;
    starsElement.textContent = "★".repeat(Math.max(0, amount));
 
    box.appendChild(nameElement);
    box.appendChild(starsElement);
    sparksContainer.appendChild(box);
}
 
async function updateSparks() {
    // Token propio de esta llamada: si otra llamada más nueva empieza
    // antes de que esta termine, esta se descarta al volver del await
    // (evita duplicados y resultados viejos pisando a los nuevos).
    const myToken = ++updateToken;
    const requestedRunId = currentRunId;
 
    if (requestedRunId === null || requestedRunId === undefined) {
        clearWidget();
        showMessage("Selecciona una Run.");
        return;
    }
 
    try {
        // OJO: los Table ID en Grist son exactamente como aparecen en
        // "Datos Brutos" -> "Table ID": Run_sparks y Sparks (con mayúscula).
        const table = await grist.docApi.fetchTable("Run_sparks");
        const sparksTable = await grist.docApi.fetchTable("Sparks");
 
        if (myToken !== updateToken) return; // llegó una llamada más nueva, descartar
 
        // Mapa rowId -> nombre real del spark
        const sparkNames = {};
        for (let j = 0; j < sparksTable.id.length; j++) {
            sparkNames[sparksTable.id[j]] = sparksTable.spark[j];
        }
 
        clearWidget();
 
        const rowCount = table.id.length;
        let found = false;
 
        for (let i = 0; i < rowCount; i++) {
            const runReference = table.run?.[i];
 
            if (String(runReference) !== String(requestedRunId)) {
                continue;
            }
 
            found = true;
 
            const sparkReference = table.spark?.[i];
            const sparkName = sparkNames[sparkReference] ?? `#${sparkReference}`;
 
            createSpark(sparkName, table.estrellas?.[i]);
        }
 
        if (!found) {
            showMessage("Esta Run no tiene Sparks.");
        }
 
    } catch (error) {
        if (myToken !== updateToken) return;
        console.error("Error cargando run_sparks:", error);
        clearWidget();
        showMessage("No se pudieron cargar las Sparks.");
    }
}
 
grist.onRecord(function(record) {
    if (!record) {
        currentRunId = null;
        showMessage("Selecciona una Run.");
        return;
    }
 
    // OJO: la tabla de datos del widget es Run_sparks (ya filtrada por
    // la Run seleccionada), así que record.id es el rowId de la fila de
    // Run_sparks, NO el de Runs. El rowId real de la Run está en record.run.
    currentRunId = record.run;
    updateSparks();
});
 
grist.onRecords(function() {
    if (currentRunId !== null) {
        updateSparks();
    }
});
 
</script>
 
</body>
</html>
