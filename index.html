<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; font-family: Arial, sans-serif; background: transparent; }
    #sparks { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; padding: 10px; }
    .spark { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid #cfcfcf; border-radius: 8px; background: white; padding: 9px 12px; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .spark-name { min-width: 0; overflow-wrap: break-word; }
    .stars { flex-shrink: 0; letter-spacing: 1px; color: #ffb400; }
    #message { display: none; padding: 12px; text-align: center; color: #888; font-size: 14px; }
</style>
</head>
<body>

<div id="sparks"></div>
<div id="message"></div>

<script>

grist.ready({ requiredAccess: "full" });

const sparksContainer = document.getElementById("sparks");
const message = document.getElementById("message");
let currentRunId = null;

function renderMessage(msg) {
    sparksContainer.innerHTML = "";
    message.textContent = msg;
    message.style.display = "block";
}

function createSpark(name, stars) {
    const box = document.createElement("div");
    box.className = "spark";
    
    const nameEl = document.createElement("span");
    nameEl.className = "spark-name";
    nameEl.textContent = name;
    
    const starsEl = document.createElement("span");
    starsEl.className = "stars";
    const amount = Number(stars) || 0;
    

    starsEl.textContent = amount > 0 ? "★".repeat(amount) : "☆";
    
    box.appendChild(nameEl);
    box.appendChild(starsEl);
    sparksContainer.appendChild(box);
}

async function updateWidget() {
    if (!currentRunId) {
        renderMessage("Selecciona una Run.");
        return;
    }

    try {

        let runSparksTable;
        try { runSparksTable = await grist.docApi.fetchTable("run_sparks"); } 
        catch { runSparksTable = await grist.docApi.fetchTable("Run_sparks"); }

        let sparksTable;
        try { sparksTable = await grist.docApi.fetchTable("sparks"); } 
        catch { sparksTable = await grist.docApi.fetchTable("Sparks"); }


        const sparkDictionary = {};
        for (let j = 0; j < sparksTable.id.length; j++) {
            sparkDictionary[sparksTable.id[j]] = sparksTable.spark[j];
        }

        sparksContainer.innerHTML = "";
        message.style.display = "none";
        let foundAny = false;


        for (let i = 0; i < runSparksTable.id.length; i++) {
            const filaRunId = runSparksTable.run?.[i];
            

            if (filaRunId === currentRunId) {
                foundAny = true;
                const refSparkId = runSparksTable.spark?.[i];
                const estrellas = runSparksTable.estrellas?.[i];
                

                const nombreReal = sparkDictionary[refSparkId] || `Spark ID #${refSparkId}`;
                createSpark(nombreReal, estrellas);
            }
        }

        if (!foundAny) {
            renderMessage("Esta Run no tiene Sparks asignadas.");
        }

    } catch (error) {
        console.error("Error leyendo datos de Grist:", error);
        renderMessage("Error cargando la base de datos.");
    }
}


grist.onRecord(function(record) {
    if (!record || !record.id) {
        currentRunId = null;
        renderMessage("Selecciona una Run.");
        return;
    }

    currentRunId = record.id;
    updateWidget();
});
</script>
</body>
</html>
