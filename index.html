<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
* {
    box-sizing: border-box;
}
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: transparent;
    font-family: Arial, sans-serif;
}
#sparks {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    padding: 10px;
}
.spark {
    min-height: 48px;
    padding: 9px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border: 1px solid #cfcfcf;
    border-radius: 8px;
    background: white;
    font-size: 14px;
    line-height: 1.2;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
}
.spark-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.stars {
    flex-shrink: 0;
    white-space: nowrap;
    letter-spacing: 1px;
}
#message {
    display: none;
    padding: 12px;
    text-align: center;
    color: #888;
    font-size: 14px;
}
</style>
</head>
<body>
<div id="sparks"></div>
<div id="message"></div>
<script>
grist.ready({
    requiredAccess: "read table"
});


const SPARKS_TABLE_ID = "Sparks";

const sparksContainer = document.getElementById("sparks");
const message = document.getElementById("message");
let currentRun = null;
let currentRecords = [];
let sparkNames = {}; 

function clearWidget() {
    sparksContainer.innerHTML = "";
    message.style.display = "none";
}

function showMessage(text) {
    sparksContainer.innerHTML = "";
    message.textContent = text;
    message.style.display = "block";
}

function createSpark(name, starsAmount) {
    const box = document.createElement("div");
    box.className = "spark";
    const nameElement = document.createElement("span");
    nameElement.className = "spark-name";
    nameElement.textContent = name ?? "";
    const starsElement = document.createElement("span");
    starsElement.className = "stars";
    const amount = Number(starsAmount) || 0;
    starsElement.textContent = "★".repeat(Math.max(0, amount));
    box.appendChild(nameElement);
    box.appendChild(starsElement);
    sparksContainer.appendChild(box);
}

function updateWidget() {
    clearWidget();
    if (!currentRun) {
        showMessage("Selecciona una Run.");
        return;
    }

    let found = false;
    for (const record of currentRecords) {
        const runRowId = record.run;
        if (String(runRowId) !== String(currentRun.id)) {
            continue;
        }
        found = true;

        const sparkRowId = record.spark;
        const sparkName = sparkNames[sparkRowId] ?? `#${sparkRowId}`;

        createSpark(sparkName, record.estrellas);
    }
    if (!found) {
        showMessage("Esta Run no tiene Sparks.");
    }
}

async function loadSparkNames() {
    try {
        const table = await grist.docApi.fetchTable(SPARKS_TABLE_ID);
        sparkNames = {};
        for (let i = 0; i < table.id.length; i++) {
            sparkNames[table.id[i]] = table.spark[i];
        }
    } catch (e) {
        console.error("No se pudo cargar la tabla de sparks:", e);
    }
    updateWidget();
}

grist.onRecord(function(record) {
    currentRun = record || null;
    updateWidget();
});

grist.onRecords(function(records) {
    currentRecords = records || [];
    updateWidget();
});

loadSparkNames();
</script>
</body>
</html>
