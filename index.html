<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vista previa Sparks</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #f5f5f5;
        font-family: Arial, sans-serif;
    }

    .container {
        width: 100%;
        padding: 18px;
    }

    .sparks {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        width: 100%;
    }

    .spark {
        min-height: 48px;
        padding: 9px 12px;

        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;

        border: 1px solid #cfcfcf;
        border-radius: 8px;
        background: white;

        font-size: 14px;
        line-height: 1.2;

        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .stars {
        flex-shrink: 0;
        white-space: nowrap;
        letter-spacing: 1px;
    }
</style>
</head>

<body>

<div class="container">
    <div class="sparks" id="sparks"></div>
</div>

<script>

const demoSparks = [
    ["Speed", 3],
    ["Stamina", 2],
    ["Power", 3],
    ["Mile", 2],
    ["Grass", 3],
    ["Long Corners", 1],
    ["Straightaways", 2],
    ["Late Surger", 3],
    ["End Closer", 2],
    ["Pace Chaser", 3],
    ["Front Runner", 2],
    ["Medium Corners", 1]
];

const container = document.getElementById("sparks");

for (const [name, amount] of demoSparks) {

    const box = document.createElement("div");
    box.className = "spark";

    const nameElement = document.createElement("span");
    nameElement.className = "name";
    nameElement.textContent = name;

    const starsElement = document.createElement("span");
    starsElement.className = "stars";
    starsElement.textContent = "★".repeat(amount);

    box.appendChild(nameElement);
    box.appendChild(starsElement);

    container.appendChild(box);
}

</script>

</body>
</html>
